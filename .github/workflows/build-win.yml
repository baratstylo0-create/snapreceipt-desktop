name: Build signed Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caea8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Build and verify signed installer
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npm run build:win:release

      - name: Upload signed installer and checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapreceipt-windows-signed
          path: |
            dist/SnapReceipt-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
